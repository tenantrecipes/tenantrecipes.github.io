# Builds the site and deploys dist/ to GitHub Pages on every push to main (and on manual run).
# Inactive until this folder is pushed to a GitHub repo and Pages "Source" is set to "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the What's new page lists published changes from git log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 build.py   # validates recipes + checks links; fails = no deploy
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
